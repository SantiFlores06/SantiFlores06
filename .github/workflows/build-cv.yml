# Regenerates CV.pdf every time CV.md changes on main.
# Uses only the runner's own packages (no third-party actions besides checkout).
name: Build CV PDF

on:
  push:
    branches: [main]
    paths: ["CV.md", ".github/workflows/build-cv.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cv
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pandoc texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended lmodern

      - name: Build CV.pdf
        run: |
          pandoc CV.md -o CV.pdf \
            -V geometry:margin=1.5cm \
            -V fontsize=10pt \
            -V pagestyle=empty \
            -V colorlinks=true -V urlcolor=blue -V linkcolor=blue

      - name: Commit CV.pdf if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CV.pdf
          git diff --cached --quiet || git commit -m "chore: rebuild CV.pdf"
          git push
